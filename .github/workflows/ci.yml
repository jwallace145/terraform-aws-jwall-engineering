name: ci

on:
  pull_request:

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  TERRAFORM_VERSION: "1.14.7"
  TFLINT_VERSION: "v0.59.1"
  TERRAFORM_DOCS_VERSION: "v0.24.0"

jobs:
  commitlint:
    name: commitlint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Lint every commit in the PR range (base..head)
        run: npx commitlint --from "${{ github.event.pull_request.base.sha }}" --to "${{ github.event.pull_request.head.sha }}" --verbose

  pr-title:
    name: pr-title
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Lint the PR title as a commit header
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$PR_TITLE" | npx commitlint --verbose

  commitlint-rules:
    name: commitlint-rules
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Check fixture messages pass/fail as expected
        run: bash scripts/test-commitlint.sh

  fmt:
    name: fmt
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
      - run: terraform fmt -check -recursive -diff

  terraform:
    # Explicit name so the check context is `terraform (<module>)` rather than
    # the default `terraform (<module>, <path>)` for a multi-key matrix.
    name: terraform (${{ matrix.module }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { module: root, path: . }
          - { module: context, path: modules/context }
          - { module: site-bucket, path: modules/site-bucket }
          - { module: tfstate-bucket, path: modules/tfstate-bucket }
          - { module: hosted-zone, path: modules/hosted-zone }
          - { module: github-oidc-role, path: modules/github-oidc-role }
          - { module: ci-plan-role, path: modules/ci-plan-role }
          - { module: ci-preview-role, path: modules/ci-preview-role }
          - { module: ci-apply-role, path: modules/ci-apply-role }
          - { module: ci-release-role, path: modules/ci-release-role }
          - { module: ci-task-role, path: modules/ci-task-role }
          - { module: ci-policies, path: modules/ci-policies }
          # Policy leaves are internal to ci-policies and have no example.
          - { module: ci-policies/tfstate/read, path: modules/ci-policies/tfstate/read, example: false }
          - { module: ci-policies/tfstate/write, path: modules/ci-policies/tfstate/write, example: false }
          - { module: ci-policies/static-site/read, path: modules/ci-policies/static-site/read, example: false }
          - { module: ci-policies/static-site/deploy, path: modules/ci-policies/static-site/deploy, example: false }
          - { module: ci-policies/static-site/previews, path: modules/ci-policies/static-site/previews, example: false }
          - { module: ci-policies/foundation/read, path: modules/ci-policies/foundation/read, example: false }
          - { module: ci-policies/foundation/manage, path: modules/ci-policies/foundation/manage, example: false }
          - { module: ci-policies/ecr/pull, path: modules/ci-policies/ecr/pull, example: false }
          - { module: ci-policies/ecr/push, path: modules/ci-policies/ecr/push, example: false }
          - { module: ci-policies/container/read, path: modules/ci-policies/container/read, example: false }
          - { module: ci-policies/container/manage, path: modules/ci-policies/container/manage, example: false }
          - { module: ci-policies/container/release, path: modules/ci-policies/container/release, example: false }
          - { module: ci-policies/task/read, path: modules/ci-policies/task/read, example: false }
          - { module: ci-policies/task/manage, path: modules/ci-policies/task/manage, example: false }
          - { module: ci-policies/task/launch, path: modules/ci-policies/task/launch, example: false }
          - { module: ci-policies/dataset/read, path: modules/ci-policies/dataset/read, example: false }
          - { module: ci-policies/dataset/manage, path: modules/ci-policies/dataset/manage, example: false }
          - { module: ecr-repository, path: modules/ecr-repository }
          - { module: private-bucket, path: modules/private-bucket }
          - { module: dataset-bucket, path: modules/dataset-bucket }
          - { module: vpc, path: modules/vpc }
          - { module: container-instance, path: modules/container-instance }
          - { module: task-runner, path: modules/task-runner }
          - { module: static-site, path: modules/static-site }
          - { module: preview-site, path: modules/preview-site }
    defaults:
      run:
        working-directory: ${{ matrix.path }}
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false
      - uses: terraform-linters/setup-tflint@v6
        with:
          tflint_version: ${{ env.TFLINT_VERSION }}
      - name: terraform init (module)
        run: terraform init -backend=false -input=false
      - name: terraform validate (module)
        run: terraform validate
      - name: terraform init (example)
        if: matrix.example != false
        run: terraform init -backend=false -input=false
        working-directory: ${{ matrix.path }}/examples/basic
      - name: terraform validate (example)
        if: matrix.example != false
        run: terraform validate
        working-directory: ${{ matrix.path }}/examples/basic
      - name: tflint --init
        run: tflint --init --config "$GITHUB_WORKSPACE/.tflint.hcl"
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: tflint (module)
        run: tflint --config "$GITHUB_WORKSPACE/.tflint.hcl" --format compact
      - name: tflint (example)
        if: matrix.example != false
        run: tflint --config "$GITHUB_WORKSPACE/.tflint.hcl" --format compact
        working-directory: ${{ matrix.path }}/examples/basic
      - name: terraform test (mock provider, no AWS credentials)
        run: terraform test
      - name: Script unit tests (modules that ship files/test_*.py)
        if: hashFiles(format('{0}/files/test_*.py', matrix.path)) != ''
        run: python3 -m unittest discover -s files -p 'test_*.py' -v
      - name: shellcheck (modules that ship files/*.sh)
        if: hashFiles(format('{0}/files/*.sh', matrix.path)) != ''
        run: shellcheck files/*.sh
      - name: Install terraform-docs
        run: |
          curl -fsSL "https://terraform-docs.io/dl/${TERRAFORM_DOCS_VERSION}/terraform-docs-${TERRAFORM_DOCS_VERSION}-linux-amd64.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP" terraform-docs
          install -m 0755 "$RUNNER_TEMP/terraform-docs" /usr/local/bin/terraform-docs
          terraform-docs --version
      - name: terraform-docs diff check
        run: terraform-docs --config "$GITHUB_WORKSPACE/.terraform-docs.yml" --output-check .
