# Local hooks. CI is the authoritative check; these just shorten the feedback loop.
#
# Setup:
#   npm ci
#   pre-commit install --hook-type commit-msg --hook-type pre-commit
repos:
  - repo: local
    hooks:
      - id: commitlint
        name: commitlint (single-line Conventional Commit, Co-authored-by trailers only)
        entry: npx --no-install commitlint --edit
        language: system
        stages: [commit-msg]
        always_run: true
        pass_filenames: true

  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.109.2
    hooks:
      - id: terraform_fmt
      - id: terraform_validate
        args:
          - --hook-config=--retry-once-with-cleanup=true
          - --tf-init-args=-backend=false
      - id: terraform_tflint
        args:
          - --args=--config=__GIT_WORKING_DIR__/.tflint.hcl
      - id: terraform_docs
        args:
          - --args=--config=.terraform-docs.yml
